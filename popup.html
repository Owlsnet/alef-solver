<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root {
    color-scheme: dark;
    --accent: #5b21b6;        /* dark purple: buttons */
    --accent-hover: #6d2fd0;
    --accent-check: #7c3aed;  /* a tick has to stand out on the dark panel */
  }
  body {
    margin: 0; padding: 14px; width: 268px;
    background: #14141a; color: #e8e8f0;
    font: 13px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 { margin: 0 0 11px; font-size: 13px; font-weight: 600; letter-spacing: .02em; }
  h1 span { color: #8b8ba7; font-weight: 400; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 7px 0; }
  label { color: #b8b8cc; font-size: 12.5px; cursor: pointer; user-select: none; }
  select {
    background: #21212c; color: #e8e8f0; border: 1px solid #33333f;
    border-radius: 6px; padding: 4px 6px; font-size: 12px; max-width: 150px;
  }
  input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--accent-check); cursor: pointer; }
  .btn {
    width: 100%; margin-top: 11px; padding: 9px;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px;
    font: 600 13px/1 inherit; cursor: pointer;
  }
  .btn:hover { background: var(--accent-hover); }
  .btn:focus-visible, select:focus-visible, input[type=checkbox]:focus-visible { outline: 2px solid #a78bfa; outline-offset: 2px; }
  .btn.ghost { background: #21212c; color: #c8c8dc; font-weight: 400; padding: 6px; margin-top: 7px; }
  .btn.ghost:hover { background: #2a2338; }
  [hidden] { display: none !important; }
  .warn {
    display: none; margin-top: 10px; padding: 8px 10px; border-radius: 7px;
    background: #3a2418; color: #ffcba4; font-size: 12px;
  }
  .warn.on { display: block; }
  #last { margin-top: 10px; font: 12px/1.4 ui-monospace, Consolas, monospace; color: #8b8ba7; min-height: 1em; }
  hr { border: 0; border-top: 1px solid #2a2a36; margin: 12px 0 4px; }
</style>
</head>
<body>
  <h1>Alef Solver <span><span id="hk">· Ctrl+Shift+S</span><span id="ver"></span></span></h1>

  <div class="row"><label for="autoSubmit">Submit automatically</label>
    <input type="checkbox" id="autoSubmit"></div>
  <div class="row"><label for="openPassage">Open "Read Passage" first</label>
    <input type="checkbox" id="openPassage"></div>
  <div class="row"><label for="screenshot">Screenshot</label>
    <select id="screenshot">
      <option value="auto">Auto (when needed)</option>
      <option value="smart">Smart — only if the words aren't enough (fastest)</option>
      <option value="always">Always</option>
      <option value="never">Never — DOM only</option>
    </select></div>
  <div class="row"><label for="cachePassage">Reuse passage per lesson</label>
    <input type="checkbox" id="cachePassage"></div>
  <div class="row"><label for="advance">Click Next after each</label>
    <input type="checkbox" id="advance"></div>
  <div class="row"><label for="skipLater">Skip questions that offer “I’ll try later”</label>
    <input type="checkbox" id="skipLater"></div>
  <div class="row"><label for="autoNextLesson">Go to the next lesson when done</label>
    <input type="checkbox" id="autoNextLesson"></div>

  <button class="btn" id="run">Solve this question (Ctrl+Shift+S)</button>
  <button class="btn" id="lesson">Solve whole lesson</button>
  <button class="btn ghost" id="stop">Stop</button>
  <button class="btn ghost" id="dump">Dump page structure (Ctrl+Shift+D)</button>
  <button class="btn ghost" id="report">Copy last report (dump or failure)</button>
  <button class="btn ghost" id="opts">Options…</button>

  <div class="warn" id="warn">No API key set. Open Options and paste your key.</div>
  <div id="last"></div>

<script src="popup.js"></script>
</body>
</html>
