<!doctype html>
<!-- Host page for tools/dndkit/sort.jsx — the ordering question on the real @dnd-kit/sortable.
     The bundle is built by `node tools/dndkit/setup.js` into .tmp/dndkit (not kept in the project). -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Alef fixture — ordering on dnd-kit</title>
<style>
  body { margin: 0; font: 16px system-ui; color: #1c2430; background: #fff; }
  .lib-sorting-container { display: flex; gap: 40px; margin: 70px 0 0 120px; width: 1100px; flex-wrap: wrap; }
  .lib-widget-header-top-section { width: 100%; display: flex; justify-content: space-between; }
  .lib-sorting-wrapper { width: 621px; }
  .lib-question-statement-container { font: 700 20px/1.5 system-ui; margin-bottom: 14px; }
  .lib-question-instruction { color: #0a6a7a; font-size: 15px; margin: 0 0 18px; }
  .lib-question-interactive-container { display: flex; flex-direction: column; gap: 8px; }
  .lib-sort-item { display: flex; align-items: center; gap: 14px; height: 62px; padding: 0 14px; box-sizing: border-box;
                   background: #fff; border: 1px solid #9aa5b1; border-radius: 6px; cursor: grab; touch-action: none; user-select: none; }
  .lib-sorting-handle { width: 18px; height: 28px; }
  .lib-sorting-image-wrapper { width: 400px; }
  .pic { width: 380px; height: 280px; background: #e8c9a0; border-radius: 10px; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 24px; display: flex;
          justify-content: space-between; background: #fff; border-top: 2px solid #e6e9ef; }
  .foot button { padding: 9px 22px; border-radius: 8px; border: 1px solid #c8ccd6; font: 600 15px system-ui; background: #fff; }
  .foot #submit { background: #2f6bff; color: #fff; border-color: #2f6bff; }
  .foot #submit:disabled { background: #d9f0ee; border-color: #d9f0ee; color: #a8cfcb; opacity: .4; }
</style>
</head>
<body>
<div id="app"></div>
<script src="../../.tmp/dndkit/sort.js"></script>
</body>
</html>
