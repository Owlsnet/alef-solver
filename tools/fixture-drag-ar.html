<!doctype html>
<!-- A drag-and-drop item from an Arabic lesson, as the live page showed it: the
     page is right-to-left, the instruction says "أسحبُ" (drag) with its vowel marks
     and not one English word, the items are long sentences in two-line buttons
     (taller than an English chip), and Submit reads "أُرسلُ إجابتي".

     It is deliberately free of the English word "drag" anywhere a reader can see it
     (the hidden dnd-kit text is the only place it appears, and a reader can't see
     that either) — the failure this reproduces was a detector that only ran on
     pages saying "drag".

       ?attrs=dndkit   items carry aria-roledescription="draggable" (default)
       ?attrs=none     items are plain buttons: nothing marks them
       ?gaps=2         a second gap in the same line, so reading order matters -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>Alef fixture — drag and drop (Arabic)</title>
<style>
  body { margin: 0; font: 20px/1.9 system-ui, "Segoe UI", sans-serif; color: #12384a; background: #fff; }
  .layout { display: flex; gap: 40px; margin: 70px 120px 0 0; }
  .left { width: 620px; }
  h4 { color: #0a6a7a; margin: 0 0 14px; font-size: 18px; font-weight: 500; }
  p { margin: 0 0 14px; line-height: 2.6; }
  .zone { display: inline-block; width: 225px; height: 60px; border: 1.5px dashed #555; border-radius: 6px;
          vertical-align: middle; margin: 0 4px; box-sizing: border-box; padding: 16px 20px; }
  .zone.small { width: 130px; }
  .zone svg { width: 18px; height: 18px; fill: #333; }
  .zone.filled { width: auto; min-width: 110px; border-style: solid; border-color: #6aa0f0; padding: 0 14px; line-height: 57px; }
  .tray { width: 430px; padding: 16px; background: #cfe5fb; border-radius: 12px; align-self: flex-start; }
  .item { display: flex; align-items: center; gap: 10px; width: 100%; height: 118px; padding: 0 16px; margin-bottom: 6px;
          background: #bcd8f8; border: 1px solid #6aa0f0; border-radius: 8px; box-sizing: border-box; cursor: grab;
          user-select: none; font: inherit; color: inherit; text-align: right; }
  .grip { width: 14px; height: 20px; flex: none; fill: #5a7bb5; }
  .foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 24px; display: flex;
          justify-content: flex-start; background: #fff; border-top: 2px solid #e6e9ef; }
  .foot button { padding: 9px 22px; border-radius: 8px; border: 1px solid #c8ccd6; font: 600 17px system-ui; background: #fff; }
  .foot #submit { background: #2f6bff; color: #fff; border-color: #2f6bff; }
  .foot #submit:disabled { background: #d9f0ee; border-color: #d9f0ee; color: #a8cfcb; }
</style>
</head>
<body>
<div id="root">
<aside style="position:fixed; left:6px; top:70px; width:150px; z-index:5; font-size:13px">
  <p style="margin:0 0 6px; font-weight:600">درسٌ تجريبيٌّ</p>
  <nav>
    <button id="side" style="width:100%; padding:8px">أقيّم مستوى فهمي</button>
  </nav>
</aside>
<script>
  window.__sideClicks = 0;
  document.getElementById('side').addEventListener('click', () => window.__sideClicks++);
  document.querySelector('aside nav').insertAdjacentHTML('beforeend',
    Array.from({ length: 5 }, (_, i) => `<div>السؤال ${i + 1}</div>`).join(''));
</script>

<div class="layout">
  <div class="left">
    <h4>أسحبُ الإجابـةَ الصّحيحـةَ إلى الفراغِ المناسبِ.</h4>
    <p>قالَ الطّفلُ وهوَ ينظرُ إلى السّماءِ: "ما أجملَ السّماءَ!" فماذا نفهمُ منْ كلامِهِ؟</p>
    <p id="sentence"></p>
    <div id="DndDescribedBy-0" style="display:none">To pick up a draggable item, press the space bar.</div>
    <div id="DndLiveRegion-0" role="status" aria-live="assertive" aria-atomic="true"
         style="position:fixed; width:1px; height:1px; margin:-1px; border:0; padding:0; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap">Draggable item placed-2 was dropped over droppable area options-pool</div>
  </div>
  <div class="tray" id="tray"></div>
</div>
<div class="foot"><button id="submit" disabled>أُرسلُ إجابتي</button></div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const TWO = q.get('gaps') === '2';
  const MARKED = q.get('attrs') !== 'none';

  const ICON = '<svg viewBox="0 0 16 16"><path d="M2 2h8v2H4v8H2zM6 6l8 4-3 1 2 3-1.5 1-2-3-2 2z"/></svg>';
  const GRIP = '<svg class="grip" viewBox="0 0 12 16"><circle cx="3" cy="3" r="1.4"/><circle cx="9" cy="3" r="1.4"/><circle cx="3" cy="8" r="1.4"/><circle cx="9" cy="8" r="1.4"/><circle cx="3" cy="13" r="1.4"/><circle cx="9" cy="13" r="1.4"/></svg>';

  // One gap: the live question. Two: the gaps sit on one line, so the rightmost is first.
  const ITEMS = TWO
    ? ['أسلوبٌ إنشائيٌّ', 'أسلوبٌ خبريٌّ', 'استفهامٌ', 'تعجّبٌ']
    : ['أسلوبٌ إنشائيٌّ غيرُ طلبيٍّ نوعُـهُ تعجّبٌ غرضُـهُ الإعجابُ.',
       'أسلوبٌ إنشائيٌّ طلبيٌّ، نوعُـهُ استفهامٌ غرضُـهُ التّشويقُ.',
       'أسلوبٌ إنشائيٌّ طلبيٌّ نوعُـهُ أمرٌ غرضُـهُ النّصحُ والإرشادُ.',
       'أسلوبٌ إنشائيٌّ غيرُ طلبيٍّ نوعُـهُ قسمٌ غرضُـهُ التّوكيدُ.'];
  const EXPECTED = TWO ? ['أسلوبٌ إنشائيٌّ', 'استفهامٌ'] : [ITEMS[0]];
  const GAPS = EXPECTED.length;

  document.getElementById('sentence').innerHTML = TWO
    ? 'نوعُ الأسلوبِ هو: <span class="zone small" data-z="0">' + ICON + '</span> ونوعُهُ <span class="zone small" data-z="1">' + ICON + '</span> في الجملةِ.'
    : 'نوعُ الأسلوبِ البلاغيِّ في جملـةِ (ما أجملَ السّماءَ!)، هو: <span class="zone" data-z="0">' + ICON + '</span>';

  window.__filled = Array(GAPS).fill(null);
  const tray = document.getElementById('tray');
  ITEMS.forEach((text, i) => {
    const it = document.createElement('button');
    it.className = 'item'; it.dataset.i = i; it.type = 'button';
    if (MARKED) {
      it.setAttribute('aria-roledescription', 'draggable');
      it.setAttribute('aria-describedby', 'DndDescribedBy-0');
    }
    it.innerHTML = `<span style="flex:1">${text}</span>` + GRIP;
    tray.appendChild(it);
  });

  function place(i, z) {
    const zone = document.querySelector(`.zone[data-z="${z}"]`);
    const item = tray.querySelector(`.item[data-i="${i}"]`);
    if (!zone || !item || zone.classList.contains('filled')) return;
    window.__filled[z] = ITEMS[i];
    item.remove();
    zone.classList.add('filled');
    zone.textContent = ITEMS[i];
    document.getElementById('submit').disabled = window.__filled.some(v => v == null);
  }

  let drag = null;
  tray.addEventListener('pointerdown', e => {
    const item = e.target.closest('.item');
    if (item) drag = { i: Number(item.dataset.i), x: e.clientX, y: e.clientY, moved: false };
  });
  document.addEventListener('pointermove', e => {
    if (drag && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) >= 1) drag.moved = true;
  });
  document.addEventListener('pointerup', e => {
    if (!drag) return;
    const hit = document.elementFromPoint(e.clientX, e.clientY);
    const zone = hit && hit.closest('.zone:not(.filled)');
    if (drag.moved && zone) place(drag.i, Number(zone.dataset.z));
    drag = null;
  });

  document.getElementById('submit').addEventListener('click', e => {
    const b = e.currentTarget;
    if (b.disabled) return;
    window.__dragSubmitted = true;
    window.__dragCorrect = window.__filled.every((w, i) => w === EXPECTED[i]);
    b.textContent = window.__dragCorrect ? 'صحيح' : 'غير صحيح';
    b.disabled = true;
  });
</script>
</body>
</html>
